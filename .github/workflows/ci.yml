name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI has no cached downloads and must never reach for one by accident:
  # a test that silently hits the network is a flaky test.
  PHYSPRIOR_OFFLINE: "1"
  PHYSPRIOR_NO_JULIA: "1"

jobs:
  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ruff mypy
      - name: ruff
        run: ruff check src tests scripts
      - name: ruff format check
        run: ruff format --check src tests
      - name: mypy
        run: mypy

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # torch CPU wheels only: the GPU builds are ~2 GB and nothing here needs one.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # [notebooks]: the notebook and tutorial builders import nbformat at module
      # level, and their structure tests are offline tests like any other.
      - run: pip install -e '.[nn,notebooks]' pytest pytest-cov
      - name: tests that need neither the network nor Julia
        run: pytest -m "not slow and not network and not sr" --cov --cov-report=term-missing

  tutorials:
    name: tutorials build & smoke-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[nn,notebooks]' pytest
      # Every tutorial must build and its code must parse. Executing all six
      # trains a few dozen networks and belongs in a nightly, but T1 is
      # seconds and catches the common breakage: a renamed symbol in the
      # package that the teaching notebook still refers to.
      - name: build every tutorial
        run: physprior tutorials
      - name: tutorial structure
        run: pytest tests/test_tutorials.py tests/test_docs.py -q
      - name: register the kernel
        run: python -m ipykernel install --user --name physprior
      - name: smoke-run T1
        run: physprior tutorials --execute T1

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: metadata is valid
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
